name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -p onley-core -p onley --all-targets -- -D warnings

      - name: Test
        run: cargo test -p onley-core -p onley

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  release-build:
    name: Build CLI (${{ matrix.os }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, test-macos ]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the Rust target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build binary
        shell: bash
        env:
          CARGO_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          OS_NAME: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          TARGET_DIR="target/release"
          if [ -n "$CARGO_TARGET" ]; then
            TARGET_DIR="target/$CARGO_TARGET/release"
          fi
          cargo build --release -p onley ${CARGO_TARGET:+--target "$CARGO_TARGET"}
          BINARY="onley_${OS_NAME}_${ARCH}"
          if [ "$OS_NAME" = "windows" ]; then
            cp "$TARGET_DIR/onley.exe" "${BINARY}.exe"
          else
            cp "$TARGET_DIR/onley" "$BINARY"
          fi
          echo "binary=$BINARY" >> "$GITHUB_ENV"

      - name: Package archive
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$OS_NAME" = "windows" ]; then
            ARCHIVE="onley_${TAG}_${OS_NAME}_${ARCH}.zip"
            7z a "$ARCHIVE" "${BINARY}.exe"
          else
            ARCHIVE="onley_${TAG}_${OS_NAME}_${ARCH}.tar.gz"
            tar czf "$ARCHIVE" "$BINARY"
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" >> /tmp/checksums-all.txt
          else
            shasum -a 256 "$ARCHIVE" >> /tmp/checksums-all.txt
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.archive }}
          path: ${{ env.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ matrix.os }}-${{ matrix.arch }}
          path: /tmp/checksums-all.txt

  desktop-build:
    name: Build desktop packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, test-macos ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSH
        run: curl -fsSL https://nsh.dev/install.sh | sh

      - name: Build desktop packages
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nsh package --target macos -o dist cmd/onley-app
          {
            echo "app=dist/Onley.app"
          } >> "$GITHUB_ENV"

      - name: Validate Apple signing secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign and notarize the macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1 || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID Application identity not found"
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          NOTARY_ZIP="$RUNNER_TEMP/Onley-notarize.zip"
          ditto -c -k --keepParent "$app" "$NOTARY_ZIP"
          RESULT=$(xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --output-format json)
          STATUS=$(printf '%s' "$RESULT" | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
          echo "notary status: $STATUS"
          test "$STATUS" = "Accepted"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app"
          rm -f "$NOTARY_ZIP"

      - name: Package desktop packages
        run: |
          TAG="${{ github.ref_name }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "onley-desktop_${TAG}_macos_arm64.zip"
          shasum -a 256 onley-desktop_${TAG}_macos_arm64.zip > checksums-all.txt

      - name: Verify the macOS release archive
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          DIR="$RUNNER_TEMP/verify"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          ditto -x -k "onley-desktop_${TAG}_macos_arm64.zip" "$DIR"
          spctl -a -vvv -t exec "$DIR/Onley.app"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-packages
          path: |
            onley-desktop_*.zip
            checksums-all.txt

  release-publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ release-build, desktop-build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts
          merge-multiple: false

      - name: Collect archives and checksums
        run: |
          find /tmp/artifacts -name 'checksums-all.txt' -exec cat {} \; | sort -u > checksums.txt
          mkdir -p archives
          for d in /tmp/artifacts/*/; do
            name=$(basename "$d")
            case "$name" in checksums-*) continue ;; esac
            for f in "$d"*; do
              file=$(basename "$f")
              case "$file" in checksums-all.txt|checksums.txt) continue ;; esac
              cp "$f" archives/
            done
          done
          ls -la archives/
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            archives/*
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
