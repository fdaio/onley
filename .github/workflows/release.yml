name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  release-build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BINARY="onley_${{ matrix.os }}_${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "$BINARY" ./cmd/onley
          echo "binary=$BINARY" >> $GITHUB_ENV

      - name: Package archive
        run: |
          BINARY="${{ env.binary }}"
          TAG="${{ github.ref_name }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            ARCHIVE="onley_${TAG}_${{ matrix.os }}_${{ matrix.arch }}.zip"
            7z a "$ARCHIVE" "$BINARY"
          else
            ARCHIVE="onley_${TAG}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
            tar czf "$ARCHIVE" "$BINARY"
          fi
          echo "archive=$ARCHIVE" >> $GITHUB_ENV
          sha256sum "$ARCHIVE" >> /tmp/checksums-all.txt

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.archive }}
          path: ${{ env.archive }}

      - name: Upload checksums (intermediate)
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ matrix.os }}-${{ matrix.arch }}
          path: /tmp/checksums-all.txt

  desktop-build:
    name: Build desktop packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Build desktop packages
        run: |
          go tool nsgo build -target macos_arm64,macos_x64,windows_x64,linux_x64 ./cmd/onley-app
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "version=$VERSION"
            echo "tag=${GITHUB_REF_NAME}"
            echo "dist=cmd/onley-app/dist"
          } >> "$GITHUB_ENV"

      - name: Validate Apple signing secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign and notarize macOS apps
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1 || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID Application identity not found"
            exit 1
          fi
          for arch in arm64 x64; do
            APP="$dist/Onley-$version-macos_$arch/Onley.app"
            if [ ! -d "$APP" ]; then
              echo "::error::Missing $APP"
              exit 1
            fi
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"

            NOTARY_ZIP="$RUNNER_TEMP/Onley-$version-macos_$arch-notarize.zip"
            ditto -c -k --keepParent "$APP" "$NOTARY_ZIP"
            RESULT=$(xcrun notarytool submit "$NOTARY_ZIP" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --output-format json)
            STATUS=$(printf '%s' "$RESULT" | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "notary status: $STATUS"
            test "$STATUS" = "Accepted"
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl -a -vvv -t exec "$APP"
            rm -f "$NOTARY_ZIP"
          done

      - name: Package desktop packages
        run: |
          ROOT="$PWD"
          ditto -c -k --sequesterRsrc --keepParent \
            "$dist/Onley-$version-macos_arm64/Onley.app" \
            "onley-desktop_${tag}_macos_arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$dist/Onley-$version-macos_x64/Onley.app" \
            "onley-desktop_${tag}_macos_x64.zip"
          (cd "$dist/Onley-$version-windows_x64" && zip -qry "$ROOT/onley-desktop_${tag}_windows_x64.zip" .)
          tar -C "$dist/Onley-$version-linux_x64" -czf "onley-desktop_${tag}_linux_x64.tar.gz" .

          shasum -a 256 onley-desktop_${tag}_*.zip onley-desktop_${tag}_*.tar.gz > checksums-all.txt

      - name: Verify macOS release archives
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            DIR="$RUNNER_TEMP/verify-$arch"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            ditto -x -k "onley-desktop_${tag}_macos_${arch}.zip" "$DIR"
            spctl -a -vvv -t exec "$DIR/Onley.app"
          done

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Upload desktop archives
        uses: actions/upload-artifact@v7
        with:
          name: desktop-archives
          path: |
            onley-desktop_*.zip
            onley-desktop_*.tar.gz

      - name: Upload checksums (intermediate)
        uses: actions/upload-artifact@v7
        with:
          name: checksums-desktop
          path: checksums-all.txt

  release-publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ release-build, desktop-build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts
          merge-multiple: false

      - name: Collect archives and checksums
        run: |
          # Gather checksums from all matrix jobs
          find /tmp/artifacts -name 'checksums-all.txt' -exec cat {} \; | sort -u > checksums.txt

          # Gather archives (skip checksum dirs)
          mkdir -p archives
          for d in /tmp/artifacts/*/; do
            base=$(basename "$d")
            case "$base" in checksums-*) continue;; esac
            cp "$d"/* ./archives/ 2>/dev/null || true
          done
          ls -la archives/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            archives/*
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
