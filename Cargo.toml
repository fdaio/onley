[workspace]
resolver = "3"
members = ["crates/onley-core", "cmd/onley", "cmd/onley-app"]
exclude = ["cmd/onley-mobile"]

[workspace.package]
version = "0.2.19"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
onley-core = { path = "crates/onley-core" }
rusqlite = { version = "0.42", features = ["bundled"] }
md-5 = "0.10"
walkdir = "2.5"
notify = "8.2"
ureq = { version = "3.1", features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
same-file = "1.0"
dirs = "6"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
