[package]
name = "onley-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Onley desktop client"
publish = false

[lib]
name = "onley_app"
path = "src/lib.rs"

[[bin]]
name = "onley-app"
path = "src/main.rs"

[dependencies]
onley-core.workspace = true
serde_json.workspace = true
dirs.workspace = true
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false }

[dev-dependencies]
nsh-engine = "0.5.0"
md-5.workspace = true
nsh-testing = "0.5.0"
tempfile.workspace = true
