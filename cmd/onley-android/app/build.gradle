plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.laotree.onley.photos'
    compileSdk 33

    defaultConfig {
        applicationId "io.github.laotree.onley.photos"
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
